name: GuabItems
version: '${version}'
main: gg.guab.items.GuabItemsPlugin
api-version: '26.3'
description: Wind charges, jump boost feathers and other prank items.
authors: [Guab]
depend: [GuabCore]

commands:
  guabitems:
    description: Give or reload the Guab prank items.
    usage: /guabitems give <player> <wind_charge|jump_boost> [amount] | /guabitems reload
    permission: guab.items.admin
    aliases: [gi]

permissions:
  guab.items.admin:
    description: Give Guab items and reload their configuration.
    default: op
  guab.items.use:
    description: Use tagged Guab prank items.
    default: true
