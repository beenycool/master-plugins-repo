# Wind Charge: launches the holder forward and shoves nearby players away.
wind-charge:
  # Forward push (blocks per tick). 1.8 is a strong launch.
  power: 1.8
  # Added to the upward velocity, even when looking down.
  vertical-boost: 0.6
  # Nearby players within this many blocks are knocked away. The user is never hit.
  radius: 5.0
  # Horizontal knockback applied to nearby players.
  knockback: 1.2
  # Upward knockback applied to nearby players.
  knockback-vertical: 0.35
  # Whether one wind charge is used up per activation.
  consume: true
  # Per-player cooldown between activations, in seconds.
  cooldown-seconds: 8

# Jump Boost Feather: permanent Jump Boost, always consumed on use.
jump-boost:
  # 0 = Jump Boost I, 1 = II, 2 = III, ...
  # If the player already has a stronger level, that level is kept (never downgraded).
  amplifier: 2
  # Per-player cooldown between uses, in seconds.
  cooldown-seconds: 30

# Beer from the Wetherspoons tap in the casino.
beer:
  # Points charged per pint. 1 keeps it cheap enough to be a Wetherspoons.
  cost: 1
  # Per-player cooldown between drinks, in seconds.
  cooldown-seconds: 2
  # Per-player cooldown between pulls of the tap, in seconds.
  tap-cooldown-seconds: 1
  # Light effects so a pint feels like a pint.
  effects:
    - type: nausea
      duration-seconds: 6
      amplifier: 0
  # Real beers that can come out of the tap. One is named in the drinker's
  # private chat line; the item stays a single stackable "Beer".
  names:
    - "Stella Artois"
    - "Guinness"
    - "Carling"
    - "Foster's"
    - "San Miguel"
    - "Peroni"
    - "Birra Moretti"
    - "Heineken"
    - "Corona"
    - "Budweiser"
    - "John Smith's"
    - "Strongbow"
    - "Thatchers Gold"
    - "London Pride"
  # One flavour line is picked at random and sent only to the drinker.
  messages:
    - "You feel mildly Wetherspoons."
    - "Cheap beer, expensive regrets."
    - "The carpet really ties the room together."
    - "You order at the bar. Nobody comes."
    - "That is one pint closer to closing time."
    - "A true Spoons classic."
  # The barrel that acts as the tap.
  tap:
    world: guab_casino
    x: -20
    y: 66
    z: -14

# The Wetherspoons pub side of the plugin.
pub:
  # Centre of the pub, used by /round and the drunk radius checks.
  centre:
    world: guab_casino
    x: -20.5
    y: 65.0
    z: -13.0
  pints:
    leaderboard:
      enabled: true
      world: guab_casino
      x: -17.5
      y: 67.3
      z: -12.5
  drunk:
    # Pints older than this stop counting towards the drunk meter.
    window-seconds: 600
  round:
    radius: 14.0
    cost-per-pint: 1
    cooldown-seconds: 30
  darts:
    board:
      world: guab_casino
      x: -24
      y: 66
      z: -12
    cooldown-seconds: 2
  quiz:
    enabled: true
    # Seconds between automatic questions.
    interval-seconds: 600
    reward: 100
    timeout-seconds: 90
    # "question | answer" or "question | answer one/answer two"
    questions:
      - "What is the capital of Australia? | Canberra"
      - "How many players from one team are on a football pitch? | 11/eleven"
      - "What is the chemical symbol for gold? | Au"
      - "Which stout is known as the black stuff? | Guinness"
      - "What year did the first Wetherspoon open? | 1979"
      - "Which is the largest planet in the solar system? | Jupiter"
      - "What is seven multiplied by eight? | 56/fifty six"
      - "Which country does Peroni come from? | Italy"
      - "Which spirit is the base of a mojito? | rum/white rum"
      - "How many pints are in a UK gallon? | 8/eight"
      - "Which city is the home of the Cavern Club? | Liverpool"
      - "What is the main grain in beer? | barley"
  menu:
    # Shelves whose contents are display-only and cannot be taken.
    shelves:
      - "guab_casino;-23;66;-15"
      - "guab_casino;-22;66;-15"
      - "guab_casino;-21;66;-15"
      - "guab_casino;-20;66;-15"
      - "guab_casino;-19;66;-15"

command:
  # Upper bound accepted by /guabitems give.
  max-give-amount: 64
