# Token-protected HTTP command endpoint.
#
# Loopback by default: the port is not reachable from the internet. Use an SSH
# tunnel from your laptop (see README.md):
#
#   ssh -N -L 39100:127.0.0.1:39100 user@your-server
#   curl -H "Authorization: Bearer SECRET" "http://127.0.0.1:39100/command?cmd=list"
#   curl -X POST -H "Authorization: Bearer SECRET" --data "say hello" \
#        "http://127.0.0.1:39100/command"
#
# Prefer the Authorization header over ?token=; query strings end up in logs
# and shell history. If you must expose the port directly, put TLS in front of
# it (reverse proxy) and set web.allowed-ips.
web:
  enabled: true
  # Loopback only for bare-metal installs. When Paper runs inside a container
  # with a 127.0.0.1:39100:39100 host mapping, set this to 0.0.0.0: the
  # container sees its own interface, while the host side stays loopback-only.
  bind: "127.0.0.1"
  port: 39100

  # Must be a long random string. The server refuses to start with the default.
  token: "change-me-to-a-long-random-string"

  request-timeout-seconds: 10
  max-command-length: 1000
  # Cap on POST bodies before they are read/decoded.
  max-body-bytes: 16384
  # Per-source-IP cap for all /command requests, including failed auth attempts.
  rate-limit-per-minute: 60

  # Empty list = allow any source IP. Otherwise list exact IPs.
  allowed-ips: []

  # Refuse commands starting with these strings (lowercase). Example:
  # blocked-prefixes: ["op ", "deop ", "stop", "restart"]
  blocked-prefixes: []
