name: GuabRickroll
version: '${version}'
main: gg.guab.rickroll.GuabRickrollPlugin
api-version: '26.3'
description: The configurable rickroll block, now with a cinema screen.
authors: [Guab]
depend: [GuabCore]
commands:
  rickroll:
    description: Manage the rickroll block and cinema show
    usage: /rickroll <setblock|remove|test|stop|stopall|pause|resume|status|pack|verify|reload>
permissions:
  guab.rickroll.admin:
    description: Manage rickroll blocks and shows
    default: op
