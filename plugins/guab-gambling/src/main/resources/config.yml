# Set this to true on event night. When false, /casino tells players the casino is closed.
event:
  enabled: false

# Chat-driven blackjack table, settled against the Guab points ledger.
blackjack:
  enabled: true
  min-bet: 10
  # -1 means no upper limit.
  max-bet: -1
  dealer-stands-on: 17
  blackjack-payout: 1.5
  timeout-seconds: 120
  decks: 6
  # Physical dealer in the pub. Right-click opens the 26.3 bet dialog.
  # Staff can move it with /blackjack setdealer.
  dealer:
    enabled: true
    world: guab_casino
    x: -5.5
    y: 65.0
    z: -13.0
    yaw: 0.0

venue:
  world: guab_casino
  # Centre of the hall. The room is 51x35 and 9 blocks tall around this point.
  x: 0
  y: 64
  z: 0
  spawn-x: 0
  spawn-y: 65
  spawn-z: 15
