# Free-for-all pit outside the parkour. Kills pay points, deaths cost points.
battlepit:
  enabled: true
  kill-reward: 50
  death-penalty: 25
  keep-inventory: true
  action-bar: true
  # Announce a kill streak every N kills.
  streak-announce-every: 5

  # Horizontal radius from the pit spawn that counts as inside the arena.
  arena-radius: 24.0

  # Restore your inventory if you teleport or walk far outside the arena.
  auto-leave-outside: true

  # Brief invulnerability after joining or respawning in the pit.
  spawn-protection:
    enabled: true
    seconds: 5

  # Show the victim's remaining HP to the shooter after an arrow hit.
  arrow-hp: true

  # Cobblestone placed by fighters inside the arena crumbles after this many seconds.
  cobblestone-decay:
    enabled: true
    seconds: 15

  # Where /battlepit join drops you.
  spawn:
    world: world
    x: 100.5
    y: -61.0
    z: 100.5
    yaw: 0.0
    pitch: 0.0

  # Where /battlepit leave puts you.
  exit:
    world: world
    x: 0.5
    y: -60.0
    z: 0.5
    yaw: 0.0
    pitch: 0.0

# Parkour start, used by /parkour.
parkour:
  world: world
  x: -8.0
  y: -59.0
  z: 9.0
  yaw: 90.0
  pitch: 0.0

# Kill players who fall below this Y. The playable floor sits around Y -61,
# the pit floor is -62 and the world bottom is -64, so -66 catches falls fast.
killplane:
  enabled: true
  worlds:
    - world
  y: -66.0
  # Gamemodes the plane never kills, so admins can build below it.
  ignore-gamemodes:
    - CREATIVE
    - SPECTATOR
  message: "&cYou fell out of the world."

# Big bell ring every time a player respawns.
respawn-bell:
  enabled: true
  volume: 4.0
  pitch: 0.5

# Battle pit PvP kit, taken with /kit.
kit:
  enabled: true
  # Only allow /kit while in the battle pit.
  require-battlepit: true
  # Clear the player's inventory before giving the kit.
  clear-inventory: true
  cooldown-seconds: 30
