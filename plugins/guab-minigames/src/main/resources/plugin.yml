name: GuabMinigames
version: '${version}'
main: gg.guab.minigames.GuabMinigamesPlugin
api-version: '26.3'
description: Battle pit and other point-earning minigames.
authors: [Guab]
depend: [GuabCore]

commands:
  battlepit:
    description: Join, leave or manage the battle pit.
    usage: /battlepit join|leave|status
    aliases: [pit, bp]
  parkour:
    description: Teleport to the parkour start.
    usage: /parkour [set|reload]
    aliases: [pk]
  kit:
    description: Take the battle pit PvP kit.
    usage: /kit
  killplane:
    description: Show or change the kill plane.
    usage: /killplane [on|off|set <y>|reload|status]

permissions:
  guab.battlepit.use:
    description: Join and leave the battle pit.
    default: true
  guab.battlepit.admin:
    description: Set the pit spawn and exit, and reload its config.
    default: op
  guab.parkour.use:
    description: Teleport to the parkour start.
    default: true
  guab.parkour.admin:
    description: Set or reload the parkour start.
    default: op
  guab.kit.use:
    description: Take the battle pit PvP kit.
    default: true
  guab.killplane.admin:
    description: Change the kill plane threshold or toggle it.
    default: op
