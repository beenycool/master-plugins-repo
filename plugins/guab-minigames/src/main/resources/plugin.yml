name: GuabMinigames
version: '${version}'
main: gg.guab.minigames.GuabMinigamesPlugin
api-version: '26.3'
description: Battle pit and other point-earning minigames.
authors: [Guab]
depend: [GuabCore]

commands:
  battlepit:
    description: Join, leave or manage the battle pit.
    usage: /battlepit join|leave|quit|status|stats [player]|top [kills|deaths|streak]|kick <player>|purge|setspawn|setexit|reload
    aliases: [pit, bp]
  kit:
    description: Take the battle pit PvP kit.
    usage: /kit
  killplane:
    description: Show or change the kill plane.
    usage: /killplane [on|off|set <y>|world add|remove|list|reload|status]

permissions:
  guab.battlepit.use:
    description: Join and leave the battle pit, and view session stats.
    default: true
  guab.battlepit.admin:
    description: Set the pit spawn and exit, kick, purge, and reload its config.
    default: op
  guab.kit.use:
    description: Take the battle pit PvP kit.
    default: true
  guab.killplane.admin:
    description: Change the kill plane threshold, toggle it and edit worlds.
    default: op
  guab.killplane.status:
    description: View the kill plane status without admin rights.
    default: true
  guab.killplane.bypass:
    description: Never be killed by the kill plane.
    default: false
