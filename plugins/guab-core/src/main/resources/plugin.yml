name: GuabCore
version: '${version}'
main: gg.guab.core.GuabCorePlugin
api-version: '26.3'
description: Shared helpers and points ledger for the Guab parkour plugins.
authors: [Guab]
softdepend: [Vault]
loadbefore: [MineGames]

commands:
  points:
    description: Show or change Guab points.
    usage: /points [player] | /points top [count] | /points <set|add|take> <player> <amount>
    aliases: [guabpoints, bal, balance]
  hud:
    description: Show or hide your Guab sidebar.
    usage: /hud
    aliases: [sidebar]
  stats:
    description: Show deaths, kills, rickrolls and parkour stats.
    usage: /stats [player|top [metric] [count]]
    aliases: [tracker, records]

permissions:
  guab.points.others:
    description: Check another player's points.
    default: op
  guab.points.admin:
    description: Set, add or take points.
    default: op
  guab.stats.use:
    description: View your own stats.
    default: true
  guab.stats.others:
    description: View other players' stats and leaderboards.
    default: true
