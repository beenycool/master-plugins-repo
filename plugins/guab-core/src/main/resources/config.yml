# How often balances are flushed to points.yml (seconds).
save-interval-seconds: 60

# The sidebar and the tab-list header. Both refresh on a timer so points earned
# through the casino show up without any extra plugin hooks.
hud:
  enabled: true
  update-ticks: 20

  scoreboard:
    enabled: true
    title: "&6&lGUAB"
    lines:
      - "&7Points &8» &6%points%"
      - "&7Deaths &8» &f%deaths%"
      - ""
      - "&7Online &8» &f%online%"
      - ""
      - "&8Top points"
      - "&6#1 &f%top1%"
      - "&7#2 &f%top2%"
      - "&7#3 &f%top3%"
      - ""
      - "&8/casino &7for the casino"
      - "&8/blackjack &7for cards"
      - "&8/points &7for the leaderboard"

  tab:
    enabled: true
    header: "&6&lGUAB PARKOUR\n&7Casino night"
    footer: "&7Points &8» &6%points% &8| &7Online &f%online%"

  # Welcome guide shown only to the player who just joined. Supports %player%
  # and %points%. A row of clickable command buttons is appended automatically.
  join-message:
    enabled: true
    lines:
      - "&6&lWelcome to Guab, &f%player%&6!"
      - "&7Balance &8» &6%points% &7points"
      - ""
      - "&6Where everything is:"
      - "&eCasino &8» &f/casino &7— slots, roulette, chicken, fights"
      - "&eWetherspoons &8» &7inside the casino, north-west corner &8— &f1-point beer"
      - "&eBattle pit &8» &f/battlepit join &7— 50 points per kill"
      - "&eBlackjack &8» &f/bj <bet> &7— hit, stand or double"
      - "&ePoints &8» &f/points &7| &f/bal &7| &f/points top"
      - "&eHUD &8» &f/hud &7to hide or show the sidebar"

  # Balance floating under each player's nametag, right above their head.
  # Uses the vanilla below_name scoreboard slot, so it follows players and works
  # for every player whose scoreboard is managed here.
  below-name:
    enabled: true
    title: "&6Points"
