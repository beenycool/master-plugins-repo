# How often balances are flushed to points.yml (seconds).
save-interval-seconds: 60

# Used by /spawn and /hub. Leave world empty to use the first loaded world.
# Leave x/y/z unset to use that world's configured spawn point.
spawn:
  world: ""
  # x: 0.5
  # y: 65.0
  # z: 0.5
  # yaw: 0.0
  # pitch: 0.0

# The sidebar and the tab-list header. Both refresh on a timer so points earned
# through the casino show up without any extra plugin hooks.
hud:
  enabled: true
  update-ticks: 20
  # Prefix points lines with bitmap icons from the Guab resource pack
  # (guab:hud). The glyphs are private-use codepoints, so clients without
  # guab-items.zip (or the rickroll pack, which embeds the same assets) show
  # missing-character boxes. Set false for a plain-text HUD.
  font-icons: true
  # Prefix the sidebar title and tab header with the Guab logo glyph when the
  # player has the resource pack. Set false to keep the plain configured title.
  logo: true

  # Neutral label for the %area% tab-header token outside the venue worlds.
  area:
    default: "Guab"

  scoreboard:
    enabled: true
    title: "&6&lGUAB"
    lines:
      - "&7Points &8» &6%points%"
      - "&7Online &8» &f%online%"
      - ""
      - "&6#1 &f%top1% &8| &7#2 &f%top2%"
      - "&8Pub &f\uE001 &7/beer"
      - "&8Darts &f\uE002 &7/darts"
      - "&7Area &8» &f%area%"

  tab:
    enabled: true
    header: "&6&lGUAB &8» &f%area%\n&7Casino night"
    footer: "&7Points &8» &6%points% &8| &7Online &f%online%"

  # Welcome guide shown only to the player who just joined. Supports %player%,
  # %points% and %online%. First-time joiners get the longer guide. Returning
  # players also get a clickable [Open menu] button. This guide is registered
  # even when hud.enabled is false; only this enabled flag controls it.
  join-message:
    enabled: true
    first-join:
      lines:
        - "&6&lWelcome to Guab, &f%player%&6!"
        - "&7You start with &6%points% &7points."
        - "&eMenu &8» &f/guab"
        - "&ePub &8» &f/beer &7· &ePit &8» &f/battlepit join"
        - "&eCasino &8» &f/casino &7· &eDarts &8» &f/darts"
    returning:
      lines:
        - "&6&lWelcome back, &f%player%&6!"
        - "&7Balance &8» &6%points% &7points"
        - "&eMenu &8» &f/guab"

  # Balance floating under each player's nametag, right above their head.
  # Uses the vanilla below_name scoreboard slot, so it follows players and works
  # for every player whose scoreboard is managed here.
  below-name:
    enabled: true
    title: "&6Points"
