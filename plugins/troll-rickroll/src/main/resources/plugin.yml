name: TrollRickroll
version: '${version}'
main: gg.guab.troll.rickroll.TrollRickrollPlugin
api-version: '26.3'
description: The 1% rickroll block, now with a cinema screen.
authors: [Guab]
depend: [TrollCore]
commands:
  rickroll:
    description: Manage the rickroll block and cinema show
    usage: /rickroll <setblock|remove|test|stop|verify|reload>
permissions:
  troll.rickroll.admin:
    description: Manage rickroll blocks and shows
    default: op
