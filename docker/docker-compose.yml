name: guab-server

services:
  mc:
    image: itzg/minecraft-server:2026.10.1-java25
    container_name: guab-mc
    restart: unless-stopped
    # Paper needs time to save worlds/plugins on SIGTERM. deploy.sh uses the
    # same 90s timeout for `docker compose down`.
    stop_grace_period: 120s
    tty: true
    stdin_open: true
    ports:
      - "30565:25565"
      # Web console is loopback-only; reach it with an SSH tunnel
      # (see plugins/guab-webconsole/README.md). Never publish 0.0.0.0:39100.
      - "127.0.0.1:39100:39100"
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "26.3"
      MEMORY: "3G"
      LEVEL_TYPE: "FLAT"
      GENERATOR_SETTINGS: '{"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":2},{"block":"minecraft:grass_block","height":1}],"biome":"minecraft:plains"}'
      GENERATE_STRUCTURES: "false"
      SPAWN_MONSTERS: "false"
      SPAWN_ANIMALS: "false"
      SPAWN_NPCS: "false"
      ALLOW_NETHER: "false"
      VIEW_DISTANCE: "4"
      SIMULATION_DISTANCE: "4"
      MAX_PLAYERS: "20"
      MOTD: "Guab Parkour - dev"
      ENABLE_RCON: "true"
      RCON_PASSWORD: "${RCON_PASSWORD}"
      PLUGINS_SYNC_UPDATE: "false"
      TZ: "Europe/London"
    volumes:
      - ./data:/data
      - ./plugins:/plugins:ro
      - ./resourcepack:/resourcepack:ro
    healthcheck:
      test: mc-health
      start_period: 3m
      interval: 30s
      timeout: 10s
      retries: 5
    mem_limit: 4g
